name: UI Docs CI

on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-docs-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - ".github/workflows/ui-docs-ci.yml"

jobs:
  ui-docs-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
