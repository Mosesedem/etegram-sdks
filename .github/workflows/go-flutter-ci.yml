name: SDK CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python-sdk:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  go-sdk:
    name: Go SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

  flutter-sdk:
    name: Flutter SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  react-native-sdk:
    name: React Native SDK Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

  kotlin-sdk:
    name: Kotlin SDK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Test
        run: gradle test

  swift-sdk:
    name: Swift SDK Build and Test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/swift-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test
