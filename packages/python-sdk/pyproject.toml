[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etegram-sdk"
version = "0.1.0"
description = "Etegram Python SDK (sync + async)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "ISC" }
authors = [
  { name = "Etegram SDK Team" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
